name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      redeploy_only:
        description: 'Skip build, redeploy last image'
        type: boolean
        default: false

env:
  IMAGE_NAME: orderservice
  REGISTRY: ghcr.io/orion4corg

jobs:
  format-and-test:
    if: ${{ !inputs.redeploy_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
      - run: dotnet format --verify-no-changes
      - run: dotnet build -c Release
      - run: dotnet test
      - run: dotnet list package --vulnerable --include-transitive

  docker-build-and-scan:
    if: ${{ !inputs.redeploy_only }}
    needs: format-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  push:
    needs: docker-build-and-scan
    if: github.ref == 'refs/heads/master' && !inputs.redeploy_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -t $REGISTRY/$IMAGE_NAME:$GITHUB_SHA .
      - run: docker push $REGISTRY/$IMAGE_NAME:$GITHUB_SHA
  
  deploy:
    needs: push
    if: (github.ref == 'refs/heads/master' || inputs.redeploy_only)
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker pull $REGISTRY/$IMAGE_NAME:$GITHUB_SHA
      - run: |
          docker stop orderservice-prod 2>/dev/null || true
          docker rm orderservice-prod 2>/dev/null || true
      - run: |
          docker run -d --name orderservice-prod \
            -p 8080:8080 \
            -e APP_VERSION=$GITHUB_SHA \
            $REGISTRY/$IMAGE_NAME:$GITHUB_SHA
      - run: curl --fail http://localhost:8080/version